# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Production Nginx Configuration
#
# Nginx sits in front of FastAPI and handles:
#   1. SSL/TLS termination (HTTPS)
#   2. HTTP → HTTPS redirect
#   3. Rate limiting (extra layer before FastAPI)
#   4. Request buffering + compression
#   5. Static frontend file serving
#   6. Security headers
#
# Real-world: Stripe, GitHub, Cloudflare all use Nginx or similar
# reverse proxies in front of their application servers.
#
# To get a free SSL certificate (production):
#   certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;           # One worker per CPU core
worker_rlimit_nofile 65535;      # Max open files per worker

events {
    worker_connections 4096;     # Max concurrent connections
    use epoll;                   # Linux-optimized event model
    multi_accept on;
}

http {
    # ── Basic settings ────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    types_hash_max_size 2048;
    server_tokens       off;      # Don't reveal Nginx version (security)

    # Compression (reduces bandwidth 60-80% for JSON responses)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Zone 1: Per-IP limit for auth endpoints (prevent brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Zone 2: Per-IP limit for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Zone 3: Global limit (DDoS protection)
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=200r/m;

    # ── Upstream (FastAPI backend) ────────────────────────────────────────────
    upstream meterflow_backend {
        server backend:8000;
        keepalive 32;            # Keep 32 persistent connections to backend
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;    # Certbot validation
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # SSL Certificate (from Let's Encrypt certbot)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern SSL settings (TLS 1.2+ only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers (important for production)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Auth endpoints (stricter rate limit) ──────────────────────────────
        location ~ ^/api/v1/auth/(login|signup|forgot-password) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://meterflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Stripe webhook (no rate limit — Stripe can't be throttled) ────────
        location /api/v1/webhooks/stripe {
            proxy_pass http://meterflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stripe needs the raw body for signature verification
            proxy_request_buffering off;
        }

        # ── All other API endpoints ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=global_limit burst=50 nodelay;

            proxy_pass http://meterflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── React frontend (static files) ─────────────────────────────────────
        location / {
            root /var/www/frontend/dist;
            try_files $uri $uri/ /index.html;   # React Router: all routes serve index.html

            # Cache static assets aggressively (JS/CSS have content hashes)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API docs (disable in production if you want) ──────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://meterflow_backend;
            proxy_set_header Host $host;
        }
    }
}
