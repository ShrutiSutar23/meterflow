# backend/pytest.ini
[pytest]
# Tell pytest which test files to discover
testpaths = tests

# Use asyncio mode = auto so every async test works without decorators
asyncio_mode = auto

# Show verbose output by default
addopts = -v --tb=short

# Markers we use in our tests
markers =
    asyncio: marks tests as async (use pytest-asyncio)
    slow: marks tests that take more than 2 seconds
    integration: marks tests that need all databases running
